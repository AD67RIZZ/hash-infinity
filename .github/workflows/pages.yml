name: Publish Infinity v2
on:
  push:
    branches: [main]
    paths: [hash-infinity-v2-source.zip, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: unzip -q hash-infinity-v2-source.zip
      - name: Verify app and apply public configuration
        working-directory: hash-infinity
        env:
          INFINITY_AI_ENDPOINT: ${{ vars.INFINITY_AI_ENDPOINT }}
          INFINITY_TURNSTILE_SITE_KEY: ${{ vars.INFINITY_TURNSTILE_SITE_KEY }}
        run: |
          npm run check
          node scripts/inject-public-config.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hash-infinity/web
  deploy:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: unzip -q hash-infinity-v2-source.zip
      - name: Build and verify Android preview APK
        working-directory: hash-infinity
        run: |
          npm install --no-audit --no-fund
          npx --no-install cap add android
          sed -i -E 's/versionCode[[:space:]]+1/versionCode 2/; s/versionName "1.0"/versionName "2.0.0"/' android/app/build.gradle
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp web/assets/icon-512.png android/app/src/main/res/drawable-nodpi/infinity_icon.png
          sed -i -E 's|@mipmap/ic_launcher(_round)?|@drawable/infinity_icon|g' android/app/src/main/AndroidManifest.xml
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          (cd android && bash ./gradlew --no-daemon assembleDebug)
          cp android/app/build/outputs/apk/debug/app-debug.apk ../hash-infinity-v2.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify ../hash-infinity-v2.apk
          unzip -tq ../hash-infinity-v2.apk
          unzip -p ../hash-infinity-v2.apk assets/public/app.js | cmp web/app.js -
      - uses: actions/upload-artifact@v4
        with:
          name: hash-infinity-v2-apk
          path: hash-infinity-v2.apk
          if-no-files-found: error
  release:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: hash-infinity-v2-apk
      - name: Publish Android APK and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0-preview >/dev/null 2>&1; then
            gh release upload v2.0.0-preview hash-infinity-v2.apk hash-infinity-v2-source.zip --clobber
          else
            gh release create v2.0.0-preview hash-infinity-v2.apk hash-infinity-v2-source.zip --target "$GITHUB_SHA" --prerelease --title "Hash Infinity v2 preview" --notes "Android preview APK with a debug signature for sideloading. Cloud Gemini requires a separately configured gateway. Web app: https://ad67rizz.github.io/hash-infinity/"
          fi
