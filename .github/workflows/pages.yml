name: Publish Infinity v2.1
on:
  push:
    branches: [main]
    paths: [hash-infinity-v2.1-byok-source.zip, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: unzip -q hash-infinity-v2.1-byok-source.zip
      - name: Verify app and configure public settings
        working-directory: hash-infinity
        env:
          INFINITY_AI_ENDPOINT: ${{ vars.INFINITY_AI_ENDPOINT }}
          INFINITY_TURNSTILE_SITE_KEY: ${{ vars.INFINITY_TURNSTILE_SITE_KEY }}
        run: |
          npm run check
          node scripts/inject-public-config.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hash-infinity/web
  deploy:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  android:
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: unzip -q hash-infinity-v2.1-byok-source.zip
      - name: Build and verify Android preview
        working-directory: hash-infinity
        run: |
          npm install --no-audit --no-fund
          npx --no-install cap add android
          sed -i -E 's/^([[:space:]]*versionCode)[[:space:]=]+[0-9]+/\1 3/; s/^([[:space:]]*versionName)[[:space:]=]+"[^"]+"/\1 "2.1.0"/' android/app/build.gradle
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp web/assets/icon-512.png android/app/src/main/res/drawable-nodpi/infinity_icon.png
          sed -i -E 's|@mipmap/ic_launcher(_round)?|@drawable/infinity_icon|g' android/app/src/main/AndroidManifest.xml
          (cd android && bash ./gradlew --no-daemon assembleDebug)
          cp android/app/build/outputs/apk/debug/app-debug.apk ../hash-infinity-v2.1.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify ../hash-infinity-v2.1.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging ../hash-infinity-v2.1.apk > apk-info.txt
          grep -F "package: name='com.hashinfinity.workspace' versionCode='3' versionName='2.1.0'" apk-info.txt
          unzip -tq ../hash-infinity-v2.1.apk
          unzip -p ../hash-infinity-v2.1.apk assets/public/app.js | cmp web/app.js -
          unzip -p ../hash-infinity-v2.1.apk assets/public/ai.js | cmp web/ai.js -
      - uses: actions/upload-artifact@v4
        with:
          name: hash-infinity-v2.1-apk
          path: hash-infinity-v2.1.apk
          if-no-files-found: error
  release:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: hash-infinity-v2.1-apk
      - name: Publish Android APK and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.1.0-preview >/dev/null 2>&1; then
            gh release upload v2.1.0-preview hash-infinity-v2.1.apk hash-infinity-v2.1-byok-source.zip --clobber
          else
            gh release create v2.1.0-preview hash-infinity-v2.1.apk hash-infinity-v2.1-byok-source.zip --target "$GITHUB_SHA" --prerelease --title "Hash Infinity v2.1 preview" --notes "Use Settings → Gemini AI to add your personal Gemini key. Android preview uses a debug signature. Back up workspace data before replacing a differently signed preview. Web app: https://ad67rizz.github.io/hash-infinity/"
          fi
